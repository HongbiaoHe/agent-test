<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Canvas Agent — from one pixel</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=block" rel="stylesheet" />
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/*
 * 《从一个像素开始》—— Canvas Agent 预告片。每一帧都是 draw(t) 的纯函数输出，由 render.mjs 逐帧截取。
 * 配色 = globals.css 的 .dark 语义 token + 节点身份色；方阵节律 = [data-thinking-anim] 规则。
 * 画幅 2.35:1：上下各留 BAR 的黑边，旁白字幕落在下黑边里，章节号落在上黑边里。
 */
const W = 1920, H = 1080, BAR = 132, CY = H / 2, PIC_H = H - BAR * 2;
const DURATION = 62;
const ctx = document.getElementById("c").getContext("2d");

const C = {
  bg: "oklch(0.17 0.004 60)", card: "oklch(0.205 0.004 60)", fg: "oklch(0.95 0.002 80)",
  muted: "oklch(0.7 0.005 70)", mutedBg: "oklch(0.255 0.004 60)", border: "oklch(1 0 0 / 8%)",
  primary: "oklch(0.92 0.002 80)", primaryFg: "oklch(0.205 0.005 60)",
  cell: "oklch(0.85 0.175 72)", upload: "oklch(0.74 0.1 210)", image: "oklch(0.72 0.15 292)",
  video: "oklch(0.73 0.17 12)", concat: "oklch(0.72 0.12 165)",
};
const CELL = [0.85, 0.175, 72]; // --thinking-cell（dark），数值形式便于插值
const DIM = 0.15;
const SANS = 'Geist, "PingFang SC", "Hiragino Sans GB", sans-serif';
const MONO = '"Geist Mono", "PingFang SC", monospace';

// ---------- 数学 ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (p) => 1 - Math.pow(1 - p, 3);
const easeIn = (p) => p * p * p;
const easeInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const easeOutBack = (p) => 1 + 2.5 * Math.pow(p - 1, 3) + 1.5 * Math.pow(p - 1, 2);
const smooth = (p) => { p = clamp(p); return p * p * (3 - 2 * p); };
const mod = (a, n) => ((a % n) + n) % n;
const hash = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const ok = ([L, Cc, h], a = 1) => `oklch(${L.toFixed(3)} ${Cc.toFixed(3)} ${h.toFixed(1)}${a < 1 ? ` / ${a.toFixed(3)}` : ""})`;
const mixLCH = (a, b, p) => { let dh = b[2] - a[2]; if (dh > 180) dh -= 360; if (dh < -180) dh += 360; return [lerp(a[0], b[0], p), lerp(a[1], b[1], p), mod(a[2] + dh * p, 360)]; };

// CSS ease-in-out 逐段套用（和浏览器里方阵的 keyframes 一致）
function cssEase(x) { let lo = 0, hi = 1, s = x; for (let i = 0; i < 22; i++) { s = (lo + hi) / 2; const bx = 3 * (1 - s) * (1 - s) * s * 0.42 + 3 * (1 - s) * s * s * 0.58 + s * s * s; if (bx < x) lo = s; else hi = s; } return 3 * (1 - s) * s * s + s * s * s; }
function keyframes(p, st) { for (let i = 1; i < st.length; i++) if (p <= st[i][0]) { const [a, va] = st[i - 1], [b, vb] = st[i]; return lerp(va, vb, cssEase((p - a) / (b - a || 1))); } return st[st.length - 1][1]; }
const PULSE_DELAY = [0, 0.62, 0.24, 0.86, 0.38, 1.02, 0.14, 0.72, 0.46], PULSE_DUR = [1.5, 1.7, 1.36, 1.62, 1.44, 1.78, 1.56, 1.32, 1.68];
const ORBIT_DELAY = { 0: 0, 1: 0.2, 2: 0.4, 5: 0.6, 8: 0.8, 7: 1.0, 6: 1.2, 3: 1.4 };
const BR_GAIN = { 4: 0.7, 1: 0.46, 7: 0.4, 5: 0.36, 3: 0.31, 0: 0.26, 8: 0.22, 2: 0.18, 6: 0.15 };
const BR_DELAY = { 4: 0, 1: 0.18, 7: 0.24, 5: 0.21, 3: 0.3, 0: 0.4, 8: 0.44, 2: 0.5, 6: 0.55 };
const SWEEP = [[0, DIM], [0.16, 1], [0.62, DIM], [1, DIM]];
function cellOpacity(anim, i, t) {
  if (anim === "lit") return 1;
  if (anim === "pulse") return keyframes(mod(t - PULSE_DELAY[i], PULSE_DUR[i]) / PULSE_DUR[i], [[0, DIM], [0.5, 1], [1, DIM]]);
  if (anim === "wave") return keyframes(mod(t - (Math.floor(i / 3) + (i % 3)) * 0.13, 1.3) / 1.3, SWEEP);
  if (anim === "orbit") return i === 4 ? 1 : keyframes(mod(t - ORBIT_DELAY[i], 1.6) / 1.6, SWEEP);
  const pk = DIM + (1 - DIM) * BR_GAIN[i];
  return keyframes(mod(t - BR_DELAY[i], 4.5) / 4.5, [[0, DIM], [0.42, pk], [0.56, DIM + (1 - DIM) * BR_GAIN[i] * 0.92], [1, DIM]]);
}

// ---------- 绘制原语 ----------
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function text(str, x, y, o = {}) {
  const { size = 24, weight = 400, font = SANS, color = C.fg, align = "left", alpha = 1, spacing = 0, blur = 0 } = o;
  if (alpha <= 0.002) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  if (blur > 0.3) ctx.filter = `blur(${blur}px)`;
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.letterSpacing = `${spacing}px`;
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = "alphabetic";
  ctx.fillText(str, x, y);
  ctx.restore();
}
const tw = (s, size, weight = 400, font = SANS, spacing = 0) => { ctx.save(); ctx.font = `${weight} ${size}px ${font}`; ctx.letterSpacing = `${spacing}px`; const w = ctx.measureText(s).width; ctx.restore(); return w; };
/** 方形柔光：纯色方块 + blur（同 .canvas-thinking-grid::before 的做法） */
function glowRect(cx, cy, size, color, alpha, blur) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.filter = `blur(${blur}px)`; ctx.fillStyle = color;
  ctx.fillRect(cx - size / 2, cy - size / 2, size, size); ctx.restore();
}
/** 3×3 方阵 */
function grid9(cx, cy, size, gap, ops, color = C.cell, alpha = 1) {
  const cs = (size - 2 * gap) / 3;
  ctx.save();
  for (let i = 0; i < 9; i++) {
    ctx.globalAlpha = alpha * ops[i];
    ctx.fillStyle = color;
    ctx.fillRect(cx - size / 2 + (i % 3) * (cs + gap), cy - size / 2 + Math.floor(i / 3) * (cs + gap), cs, cs);
  }
  ctx.restore();
}
/** 方形冲击波：一圈往外扩、越扩越淡的方框 */
function shockwave(cx, cy, t, t0, dur, maxSize, color = C.cell, width = 6) {
  const p = seg(t, t0, t0 + dur);
  if (p <= 0 || p >= 1) return;
  const s = lerp(40, maxSize, easeOut(p));
  ctx.save(); ctx.globalAlpha = (1 - p) * 0.8; ctx.strokeStyle = color; ctx.lineWidth = width * (1 - p) + 1;
  ctx.strokeRect(cx - s / 2, cy - s / 2, s, s); ctx.restore();
}

// ---------- 一幅日落：所有「图」都从这一个函数取色 ----------
// u, v ∈ [0,1]；phase ∈ [0,1] 是一天里的时刻（0 = 太阳半落，1 = 入夜）
const HZ = 0.52; // 地平线
function scene(u, v, phase) {
  const sunU = 0.5, sunV = 0.5 + phase * 0.16;
  const night = smooth(phase * 1.5 - 0.35);
  const n = hash(Math.floor(u * 243), Math.floor(v * 243));
  let col;
  if (v < HZ) {
    const k = (HZ - v) / HZ;
    // 色相从橙（48°）经红、品红绕到紫（−68° = 292°），不能直线插值——那会穿过绿
    col = [lerp(0.76, 0.27, Math.pow(k, 0.65)), lerp(0.16, 0.1, k), mod(lerp(48, -68, Math.pow(k, 0.75)), 360)];
    col = mixLCH([col[0] * lerp(1, 0.42, night), col[1] * lerp(1, 0.75, night), col[2]], [col[0] * 0.42, col[1] * 0.75, 272], night * 0.8);
    const d = Math.hypot(u - sunU, (v - sunV) * 1.1);
    const g = Math.exp(-d / 0.05) * (1 - night * 0.85);
    col = mixLCH(col, [0.84, 0.17, 66], g * 0.75);
    // 太阳只占 ~3 格：1 格是日核，3×3 是一轮太阳，9×9 是光晕，27×27 才看得见天与地平线
    const R = 0.0068;
    if (d < R && phase < 0.62) col = [0.97 - d * 18 + (n - 0.5) * 0.02, lerp(0.07, 0.17, d / R), lerp(92, 74, d / R)];
    // 两侧山影：离太阳越近，山脊越亮（逆光描边）
    const ridgeL = HZ - (0.09 + 0.06 * Math.sin(u * 11 + 1.2) + 0.035 * Math.sin(u * 31)) * clamp(1 - u * 2.1);
    const ridgeR = HZ - (0.1 + 0.055 * Math.sin(u * 13 + 4) + 0.03 * Math.sin(u * 37 + 2)) * clamp((u - 0.56) * 2.4);
    const ridge = Math.min(ridgeL, ridgeR);
    if (v > ridge && (u < 0.48 || u > 0.55)) {
      const rim = Math.exp(-(v - ridge) / 0.006) * (1 - night) * 0.5;
      col = [lerp(0.2, 0.13, night) + rim * 0.4, 0.05 + rim * 0.1, lerp(305, 60, rim)];
    }
    if (night > 0.05 && n > 0.985 && k > 0.2) col = mixLCH(col, [0.96, 0.02, 90], night * (0.6 + 0.4 * hash(n, 7)));
  } else {
    // 水面：天空的倒影压暗，外加一道太阳的碎金
    const mv = HZ - (v - HZ) * 1.3;
    col = scene(u, clamp(mv, 0, HZ - 0.001), phase);
    col = [col[0] * 0.55, col[1] * 0.8, col[2]];
    const w = 0.008 * (1 + (v - HZ) * 7);
    const ripple = hash(Math.floor(v * 243), 3) > 0.35;
    if (Math.abs(u - sunU) < w && ripple && phase < 0.7) {
      const f = (1 - (v - HZ) / (1 - HZ)) * (1 - Math.abs(u - sunU) / w) * (1 - night);
      col = mixLCH(col, [0.86, 0.16, 70], f * 0.9);
    }
    col = [col[0] + Math.sin(v * 420) * 0.012, col[1], col[2]];
  }
  return col;
}

// 大图 243×243 = 59,049 像素（3⁵ × 3⁵），逐级留缝：每一级 3×3 之间的缝 = 该级子块边长 × GAP
const LV = 5, N243 = 243, GAP = 0.1;
const S = [1]; for (let k = 0; k < LV; k++) S.push(3 * S[k] + 2 * GAP * S[k]);
const POS = new Float32Array(N243);
for (let i = 0; i < N243; i++) { let p = 0, x = i; for (let k = 0; k < LV; k++) { p += (x % 3) * (S[k] + GAP * S[k]); x = Math.floor(x / 3); } POS[i] = p; }
const BIG_HALF = S[LV] / 2;
const BIG = [];
for (let j = 0; j < N243; j++) for (let i = 0; i < N243; i++) BIG.push(ok(scene((i + 0.5) / N243, (j + 0.5) / N243, 0)));

// 隧道里的每一帧：27×27（3³ × 3³），逐帧推进一天的时刻
const N27 = 27, FR = 44;
const FRAMES = [];
for (let k = 0; k < FR; k++) {
  const ph = k / (FR - 1), cells = [];
  for (let j = 0; j < N27; j++) for (let i = 0; i < N27; i++) cells.push(scene((i + 0.5) / N27, (j + 0.5) / N27, ph));
  FRAMES.push({ lch: cells, str: cells.map((c) => ok(c)) });
}

// ---------- 旁白（文本与时间点在这里定；时长由 tts 量好后注入）----------
const NARRATION = [
  { id: "n01", at: 2.9, text: "一切，从一个像素开始。" },
  { id: "n02", at: 6.4, text: "九个像素，拼成一张图。" },
  { id: "n03", at: 10.0, text: "再多一些，就是一整个世界。" },
  { id: "n04", at: 14.8, text: "这是 Canvas Agent 生成图片的能力。" },
  { id: "n05", at: 19.4, text: "一帧，接着一帧，" },
  { id: "n06", at: 22.0, text: "时间，开始流动。" },
  { id: "n07", at: 26.4, text: "这是它生成视频的能力。" },
  { id: "n08", at: 31.9, text: "而这九个方格，也是它的脸。" },
  { id: "n09", at: 35.6, text: "它在想，在做，在找方向，你一眼就看得懂。" },
  { id: "n10", at: 41.9, text: "你只需要一句话。" },
  { id: "n11", at: 44.5, text: "它摆节点，连线，出图，出片，" },
  { id: "n12", at: 48.4, text: "整块画板，为你一格一格点亮。" },
  { id: "n13", at: 55.0, text: "从一个像素，到一整部片。" },
  { id: "n14", at: 58.6, text: "Canvas Agent。" },
];
let VO = {}; // id → 秒，render.mjs 注入
window.setVO = (m) => { VO = m; };

// ---------- 时间线 ----------
const T = {
  ignite: 2.2,
  neighbors: 6.0, zoom0: 7.2, zoom1: 15.0, imgTitle: 14.8,
  tunnel0: 17.8, fly0: 19.2, fly1: 25.9, play0: 26.0, vidTitle: 26.4, fold0: 29.4, impact: 31.3,
  faces: [32.3, 34.3, 36.3, 38.3], face1: 41.0,
  board0: 41.0, implode0: 51.6, implode1: 53.5, boom: 54.2, end: 62,
};

// ======================= A + B：点火，然后九的幂 =======================
function zoomScale(t) {
  // 屏幕上一格像素的边长（px/单位）：点火后慢推，7.2s 起按对数匀速外拉
  if (t < T.zoom0) return lerp(120, 170, easeInOut(seg(t, T.ignite, T.zoom0)));
  const p = easeInOut(seg(t, T.zoom0, T.zoom1));
  return Math.exp(lerp(Math.log(170), Math.log(760 / S[LV]), p));
}
/** 生成波前的半径（格数）：总是比屏幕可见范围略小一点，观众始终看得见那一圈在亮起来 */
function revealR(t) {
  if (t < T.neighbors) return 0;
  if (t < T.zoom0) return seg(t, T.neighbors, T.neighbors + 0.9); // 九格：中心四周八格依次亮
  const visHalf = (W * 0.38) / zoomScale(t) / (1 + GAP * 1.2);
  return Math.max(1, Math.min(122, visHalf));
}
function sceneMosaic(t) {
  if (t < T.ignite - 0.2 || t > T.fly0 + 0.4) return;
  const sc = zoomScale(t);
  // 点题时整幅图让到左边，大字放右边；进隧道前再回到正中
  const side = easeInOut(seg(t, T.imgTitle - 0.4, T.imgTitle + 0.6)) * (1 - easeInOut(seg(t, T.tunnel0 - 0.6, T.tunnel0)));
  const cx = W / 2 - SIDE * side, cy = CY;
  const ctr = 121;
  const R = revealR(t);
  const shake = impactShake(t);
  ctx.save();
  ctx.translate(shake.x, shake.y);
  // 进隧道前：整幅图退到第 0 帧的位置
  const out = easeInOut(seg(t, T.tunnel0, T.fly0));
  const sc2 = sc * lerp(1, 0.92, out);
  const alpha = 1 - seg(t, T.fly0 - 0.1, T.fly0 + 0.4);
  ctx.globalAlpha = alpha;
  // 点火：单格从一个亮点炸开
  const ign = easeOutBack(seg(t, T.ignite, T.ignite + 0.35));
  if (t < T.neighbors + 0.01) {
    const s = sc * ign;
    glowRect(cx, cy, s * 1.9, C.cell, 0.55 * ign, s * 0.35);
    ctx.fillStyle = BIG[ctr * N243 + ctr];
    ctx.fillRect(cx - s / 2, cy - s / 2, s, s);
    // 刚点燃那一下的白热
    const hot = 1 - seg(t, T.ignite, T.ignite + 0.7);
    if (hot > 0) { ctx.globalAlpha = alpha * hot * 0.9; ctx.fillStyle = "oklch(0.99 0.02 90)"; ctx.fillRect(cx - s / 2, cy - s / 2, s, s); }
  } else {
    const x0 = cx - (POS[ctr] + 0.5) * sc2, y0 = cy - (POS[ctr] + 0.5) * sc2;
    const ps = Math.max(0.6, sc2);
    const iMin = Math.max(0, Math.floor(ctr - R - 1)), iMax = Math.min(N243 - 1, Math.ceil(ctr + R + 1));
    // 中心附近的光晕跟着可见范围一起扩
    glowRect(cx, cy, Math.min(1400, (2 * R + 1) * sc2 * 1.25), C.cell, 0.1 * (1 - out), Math.min(120, sc2 * 3 + 20));
    for (let j = iMin; j <= iMax; j++) {
      const y = y0 + POS[j] * sc2;
      if (y > H - BAR || y + ps < BAR) continue;
      const dj = Math.abs(j - ctr);
      for (let i = iMin; i <= iMax; i++) {
        const x = x0 + POS[i] * sc2;
        if (x > W || x + ps < 0) continue;
        const d = Math.max(Math.abs(i - ctr), dj);
        if (d > R + 0.5) continue;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = BIG[j * N243 + i];
        ctx.fillRect(x, y, ps, ps);
        // 波前上的一圈白热：刚生成出来的像素先亮一下再落回本色
        const fresh = 1 - (R - d) / 3.5;
        if (fresh > 0 && R < 121.5) { ctx.globalAlpha = alpha * fresh * 0.75; ctx.fillStyle = "oklch(0.98 0.05 85)"; ctx.fillRect(x, y, ps, ps); }
      }
    }
  }
  ctx.restore();
  // 冲击波（点火那一下）
  shockwave(cx + shake.x, cy + shake.y, t, T.ignite, 1.6, 1500, C.cell, 10);
  // 像素计数：九的幂
  if (t >= T.neighbors && t < T.tunnel0 + 0.4) {
    const r = Math.floor(R + 0.5), n = Math.pow(2 * Math.min(r, 121) + 1, 2);
    const a = Math.min(seg(t, T.neighbors, T.neighbors + 0.5), 1 - seg(t, T.imgTitle - 0.3, T.imgTitle + 0.2));
    text(n.toLocaleString("en-US"), W - 96, H - BAR - 64, { size: 64, weight: 600, font: MONO, align: "right", alpha: a });
    text("PIXELS", W - 96, H - BAR - 30, { size: 18, font: MONO, color: C.muted, align: "right", alpha: a, spacing: 6 });
  }
}

// ======================= C：时间隧道 =======================
const FOCAL = 900, DZ = 420, FS = 640;
const SIDE = 340; // 点题构图：画面左移的距离
function framePos(k) {
  // 每 8 帧有一帧正对镜头（穿过它就是一次闪白），其余沿螺旋排在镜头四周
  if (k % 8 === 0) return { x: 0, y: 0, z: k * DZ };
  const a = k * 0.62;
  return { x: Math.cos(a) * 760, y: Math.sin(a) * 430, z: k * DZ };
}
const Z0 = -(FS * FOCAL) / 760 * 0.92; // 让第 0 帧起手正好接住整幅大图的大小
function camZ(t) {
  const p = seg(t, T.fly0, T.fly1);
  // 先慢后快：越往后越快，最后一段是冲刺
  const d = (FR - 6) * DZ;
  return Z0 + d * (0.08 * p + 0.92 * Math.pow(p, 2.2));
}
function drawFrame(k, sx, sy, size, alpha) {
  const F = FRAMES[k];
  const n = size > 160 ? 27 : size > 40 ? 9 : 3;
  const step = 27 / n;
  const gap = size * 0.012 * (27 / n) / 3;
  const cs = (size - gap * (n - 1)) / n;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = "oklch(0.12 0.004 60)";
  ctx.fillRect(sx - size / 2 - size * 0.03, sy - size / 2 - size * 0.03, size * 1.06, size * 1.06);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const si = Math.floor(i * step + step / 2), sj = Math.floor(j * step + step / 2);
    ctx.fillStyle = F.str[sj * 27 + si];
    ctx.fillRect(sx - size / 2 + i * (cs + gap), sy - size / 2 + j * (cs + gap), cs + 0.5, cs + 0.5);
  }
  ctx.restore();
}
const STARS = (() => { const r = rng(7), s = []; for (let i = 0; i < 700; i++) s.push({ x: (r() - 0.5) * 5200, y: (r() - 0.5) * 3000, z: r() * FR * DZ, c: r() < 0.7 ? CELL : r() < 0.5 ? [0.74, 0.1, 210] : [0.72, 0.15, 292] }); return s; })();
function sceneTunnel(t) {
  if (t < T.tunnel0 || t > T.play0 + 0.3) return;
  const cz = camZ(t);
  const speed = (camZ(t + 1 / 30) - cz) * 30; // 单位/秒
  const inA = seg(t, T.tunnel0, T.fly0);
  ctx.save();

  const t2 = easeOut(seg(t, T.boom + 1.4, T.boom + 2.3));
  text("从一个像素，到一整部片。", W / 2, CY + 140, { size: 38, color: C.muted, align: "center", alpha: t2, spacing: 6 });
  text("FROM A SINGLE PIXEL TO A PICTURE IN MOTION", W / 2, CY + 188, { size: 18, font: MONO, color: C.muted, align: "center", alpha: t2 * 0.8, spacing: 6 });
  const t3 = easeOut(seg(t, T.boom + 3.0, T.boom + 3.8));
  text("生成图片  ·  生成视频  ·  一个 Agent        /canvas", W / 2, H - BAR - 40, { size: 20, font: MONO, color: C.muted, align: "center", alpha: t3 * 0.9, spacing: 2 });
}

// ======================= 大字：能力点题 =======================
function bigTitle(t, t0, t1, cn, en, tone, icon) {
  const pin = easeOut(seg(t, t0 + 0.3, t0 + 1.1));
  const a = Math.min(pin, 1 - easeInOut(seg(t, t1 - 0.5, t1)));
  if (a <= 0) return;
  // 画面让到左边后，大字落在右半边
  const x = W / 2 + 140 + (1 - pin) * 40, y = CY + 30;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y - 150); ctx.scale(2, 2);
  ctx.strokeStyle = tone; ctx.lineWidth = 2; ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (const d of ICONS[icon]) ctx.stroke(new Path2D(d));
  ctx.restore();
  text(cn, x - 6, y, { size: 124, weight: 700, alpha: a, spacing: lerp(40, 10, pin), blur: (1 - pin) * 10 });
  text(en, x, y + 56, { size: 22, font: MONO, color: C.muted, alpha: a, spacing: lerp(18, 8, pin) });
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = tone; ctx.fillRect(x, y + 86, 64 * pin, 4); ctx.restore();
}
// lucide 的 Image / Film（与 /canvas 页 NODE_NOTES 同一对图标）
const ICONS = {
  image: ["M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z", "M11 9a2 2 0 1 1-4 0a2 2 0 1 1 4 0z", "m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"],
  film: ["M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z", "M7 3v18", "M3 7.5h4", "M3 12h18", "M3 16.5h4", "M17 3v18", "M17 7.5h4", "M17 16.5h4"],
};

// ======================= 电影外壳：黑边、章节、字幕、颗粒 =======================
const CHAPTERS = [[2.2, "01", "PIXEL · 像素"], [6.0, "02", "IMAGE · 图片"], [17.8, "03", "VIDEO · 视频"], [29.4, "04", "AGENT · 它的脸"], [41.0, "05", "CANVAS · 画板"]];
function chrome(t) {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, BAR); ctx.fillRect(0, H - BAR, W, BAR);
  // 章节号
  if (t < T.implode0) {
    let cur = null; for (const c of CHAPTERS) if (t >= c[0]) cur = c;
    if (cur) {
      const a = Math.min(easeOut(seg(t, cur[0], cur[0] + 0.6)), 1 - seg(t, T.implode0 - 0.5, T.implode0));
      text(cur[1], 96, BAR / 2 + 10, { size: 22, weight: 600, font: MONO, color: C.cell, alpha: a, spacing: 2 });
      text(cur[2], 140, BAR / 2 + 10, { size: 18, font: MONO, color: C.muted, alpha: a, spacing: 4 });
    }
  }
  // 旁白字幕（下黑边）
  for (const n of NARRATION) {
    const d = VO[n.id] ?? 2.5;
    const a = Math.min(seg(t, n.at - 0.1, n.at + 0.2), 1 - seg(t, n.at + d + 0.2, n.at + d + 0.5));
    if (a > 0) text(n.text, W / 2, H - BAR / 2 + 12, { size: 32, weight: 500, align: "center", alpha: a, spacing: 2 });
  }
}
function grain(t) {
  const r = rng(Math.floor(t * 30) + 1);
  ctx.save();
  for (let i = 0; i < 2600; i++) {
    const x = r() * W, y = BAR + r() * PIC_H;
    ctx.globalAlpha = 0.035 + r() * 0.04;
    ctx.fillStyle = r() < 0.5 ? "#fff" : "#000";
    ctx.fillRect(x, y, 2, 2);
  }
  ctx.restore();
}

function draw(t) {
  ctx.save();
  ctx.fillStyle = "oklch(0.1 0.004 60)"; ctx.fillRect(0, 0, W, H);
  const v = ctx.createRadialGradient(W / 2, CY, 200, W / 2, CY, W * 0.62);
  v.addColorStop(0, "oklch(0.15 0.006 60)"); v.addColorStop(1, "oklch(0.07 0.003 60)");
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.restore();

  sceneMosaic(t);
  sceneTunnel(t);
  scenePlay(t);
  sceneFold(t);
  sceneFace(t);
  sceneBoard(t);
  sceneTitle(t);
  bigTitle(t, T.imgTitle, T.tunnel0 - 0.3, "生成图片", "IMAGE GENERATION", C.image, "image");
  bigTitle(t, T.vidTitle, T.fold0 + 0.3, "生成视频", "VIDEO GENERATION", C.video, "film");
  grain(t);
  chrome(t);

  const fade = Math.max(1 - seg(t, 0, 0.6), seg(t, T.end - 1.2, T.end));
  if (fade > 0) { ctx.save(); ctx.globalAlpha = fade; ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H); ctx.restore(); }
}

// ======================= 声音的时间表（全部从上面的时间线推出来） =======================
function audioPlan() {
  const c = [];
  const add = (t, kind, i = 0, gain = 1) => c.push({ t: +t.toFixed(3), kind, i, gain });
  add(1.0, "heart"); add(1.62, "heart", 0, 0.7);
  add(T.ignite - 1.4, "riser", 14, 0.7); // 1.4s 蓄力，正好落在点火上
  add(T.ignite, "boom");
  for (let k = 1; k < 9; k++) add(T.neighbors + k * (0.9 / 8), "pixel", k);
  // 波前每扩一圈响一声：圈越扩越快，声音自己就越来越密、越来越高
  let last = 1;
  for (let t = T.zoom0; t < T.zoom1; t += 1 / 120) {
    const r = Math.floor(revealR(t));
    if (r > last) { if (r % Math.max(1, Math.floor(r / 12)) === 0) add(t, "tick", r, 0.5 + 0.5 * (r / 121)); last = r; }
  }
  add(T.imgTitle - 0.05, "hit", 0);
  add(T.tunnel0 + 0.2, "whoosh", 0, 1.2);
  add(T.fly0, "braam");
  for (let k = 1; k < FR; k++) {
    const z = framePos(k).z;
    for (let t = T.fly0; t < T.fly1; t += 1 / 60) if (camZ(t) < z && camZ(t + 1 / 60) >= z) { add(t, k % 8 === 0 ? "whooshBig" : "pass", k, 0.8); break; }
  }
  add(T.fly1 - 1.5, "riser", 15, 0.9); // 1.5s 蓄力，冲出隧道
  add(T.play0, "hit", 1);
  add(T.vidTitle - 0.05, "hit", 2, 0.8);
  add(T.fold0, "suck", Math.round((T.impact - T.fold0) * 10));
  add(T.impact, "boom", 1);
  T.faces.forEach((f, k) => add(f, "state", k));
  for (let k = 1; k <= PROMPT_TEXT.length; k += 2) add(E0 + 0.9 + (k / PROMPT_TEXT.length) * 1.5, "key", k);
  BOARD.forEach((n) => add(E0 + n.at, "pop", 0, 0.7));
  EDGES.forEach((ed) => add(E0 + ed.at, "zap", 0, 0.5));
  BOARD.forEach((n) => { if (n.gen !== undefined) for (let d = 0; d < 17; d += 2) add(E0 + n.gen + d * 0.045, "pixel", d / 2, 0.4); });
  add(T.implode0, "suck", Math.round((T.implode1 - T.implode0) * 10)); // riser / suck 的 i = 时长 × 10
  add(T.boom, "boom", 2, 1.2);
  add(T.boom, "chord");
  return {
    duration: DURATION,
    cues: c.sort((a, b) => a.t - b.t),
    narration: NARRATION,
    // 配乐的段落：pad 从头铺；律动从穿越隧道起；坍缩时全部抽空；片名一记之后只剩长和弦
    sections: { groove: T.fly0, grooveEnd: T.implode0, silence: T.implode1, boom: T.boom, faceHits: T.faces, impact: T.impact },
  };
}
window.audioPlan = audioPlan;
window.DURATION = DURATION;
window.draw = draw;
window.ready = document.fonts.ready.then(() => Promise.all([
  document.fonts.load('700 104px Geist'), document.fonts.load('600 60px Geist'), document.fonts.load('500 20px Geist'), document.fonts.load('400 20px Geist'),
  document.fonts.load('600 20px "Geist Mono"'), document.fonts.load('400 20px "Geist Mono"'),
])).then(() => { draw(0); return true; });
</script>
