packages:
  - apps/*
  - packages/*

allowBuilds:
  # desktop：Electron 的 postinstall 下载二进制（需 NODE_USE_ENV_PROXY=1 才走代理）
  electron: true
  # electron-winstaller：electron-builder 的 Windows 安装包依赖，mac 打包用不到，不跑其构建脚本
  electron-winstaller: false
  # @google/genai 无需 postinstall 构建（纯 JS SDK，已实测生图/生视频可用）
  '@google/genai': false
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  msw: true
  prisma: true
  protobufjs: false
  sharp: true
  # skia-canvas：后端设计模块的 Konva 同构渲染器，postinstall 下载预编译原生二进制
  skia-canvas: true
  unrs-resolver: true
  # desktop 视频剪辑器：postinstall 下载 ffmpeg 二进制（需 NODE_USE_ENV_PROXY=1 + HTTPS_PROXY 才走代理）
  ffmpeg-static: true

# 允许这些包运行构建/postinstall 脚本：
#   sharp / unrs-resolver: 原生模块，允许构建以确保二进制 binding 正确
#   @nestjs/core: postinstall 为捐赠提示，无副作用
onlyBuiltDependencies:
  - electron
  - '@nestjs/core'
  - sharp
  - skia-canvas
  - unrs-resolver
